name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  ci:
    runs-on: ubuntu-latest

    steps:
      # actions 固定在 major 移動標籤：修補版自動跟進，破壞性變更不會偷偷生效。
      # v4 建在 Node 20 上，runner 已強制改跑 Node 24 並發出 deprecation 警告。
      - uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          # Node 20 已於 2026-04-30 結束支援，24 是現行 LTS（到 2028-04-30）。
          # better-sqlite3 12.10 宣告支援到 26.x，這個版本在範圍內。
          node-version: '24'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Type check
        run: npm run typecheck

      # lint 放在 typecheck 之後、test 之前。加這一步是因為 eslint 10 的
      # dependabot PR 拿到綠燈，但本地跑 lint 會直接崩潰——CI 沒跑 lint，
      # 所以那個綠燈是假的。
      - name: Lint
        run: npm run lint

      - name: Test
        run: npm run test

      - name: Build
        run: npm run build
        env:
          NEXT_TELEMETRY_DISABLED: 1
          DEMO_MODE: 1
